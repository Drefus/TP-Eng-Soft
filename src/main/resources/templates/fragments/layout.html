<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="navbar">
    <div class="container">
        <a href="/" class="navbar-brand">
            <span class="icon">⚽</span>
            <!-- <span class="brand-text">SportEvent</span> removed -->
        </a>
        <button class="navbar-toggle" onclick="document.querySelector('.navbar-nav').classList.toggle('active')">☰</button>
        <ul class="navbar-nav">
            <li><a href="/">🏠 Início</a></li>
            <li><a href="/partidas">📅 Partidas</a></li>
            <li><a href="/selecoes">🏆 Seleções</a></li>
            <li><a href="/cidades">🏙️ Cidades</a></li>
            <li><a href="/chaveamento">📊 Chaveamento</a></li>
            <li>
                <a href="/admin" class="nav-admin"
                   th:if="${#authorization != null and #authorization.expression('isAuthenticated()')}">
                    ⚙️ Admin
                </a>
                <a href="/login" class="nav-admin"
                   th:unless="${#authorization != null and #authorization.expression('isAuthenticated()')}">
                    🔐 Login
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="footer">
    <div class="container">
        <p class="footer-text">© 2026 Guia da Copa — Guia da Copa 2026. Engenharia de Software.</p>
        <div class="footer-links">
            <a href="/partidas">Partidas</a>
            <a href="/selecoes">Seleções</a>
            <a href="/cidades">Cidades</a>
        </div>
    </div>
</footer>

<!-- Head Fragment -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de acompanhamento de eventos esportivos">
    <title th:text="${title} + ' | Guia da Copa'">Guia da Copa</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
</html>
