<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Seleção')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <!-- Header -->
        <div class="detail-header">
            <span class="flag-large" th:text="${selecao.bandeira}">🏳️</span>
            <h1 th:text="${selecao.nome}">Seleção</h1>
            <p class="meta" th:text="'Grupo ' + ${selecao.grupo}">Grupo A</p>
        </div>

        <!-- Estatísticas -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-number" th:text="${selecao.pontos}">0</div>
                <div class="stat-label">Pontos</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-number" th:text="${selecao.vitorias}">0</div>
                <div class="stat-label">Vitórias</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🤝</div>
                <div class="stat-number" th:text="${selecao.empates}">0</div>
                <div class="stat-label">Empates</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">❌</div>
                <div class="stat-number" th:text="${selecao.derrotas}">0</div>
                <div class="stat-label">Derrotas</div>
            </div>
        </div>

        <div class="stats-row" style="grid-template-columns: repeat(3, 1fr);">
            <div class="stat-card">
                <div class="stat-icon">⚽</div>
                <div class="stat-number" th:text="${selecao.golsPro}">0</div>
                <div class="stat-label">Gols Pró</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🥅</div>
                <div class="stat-number" th:text="${selecao.golsContra}">0</div>
                <div class="stat-label">Gols Contra</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-number" th:text="${selecao.saldoGols}">0</div>
                <div class="stat-label">Saldo de Gols</div>
            </div>
        </div>

        <!-- Partidas -->
        <section class="mt-3">
            <h2 class="section-title mb-2"><span class="icon">📅</span> Partidas</h2>
            <div class="card-grid" th:if="${not #lists.isEmpty(partidas)}">
                <a th:each="partida : ${partidas}" th:href="@{/partidas/{id}(id=${partida.id})}" class="match-card">
                    <div class="match-meta">
                        <span th:text="${#temporals.format(partida.data, 'dd/MM/yyyy')} + ' • ' + ${#temporals.format(partida.horario, 'HH:mm')}"></span>
                        <span class="match-phase"
                              th:classappend="'phase-' + ${#strings.toLowerCase(partida.fase)}"
                              th:text="${partida.fase}">Grupo</span>
                    </div>
                    <div class="match-teams">
                        <div class="match-team">
                            <span class="flag" th:text="${partida.time1.bandeira}">🏳️</span>
                            <span class="name" th:text="${partida.time1.nome}">Time 1</span>
                        </div>
                        <div class="match-score pending" th:if="${partida.golsTime1 == null}">
                            <span>— × —</span>
                        </div>
                        <div class="match-score" th:unless="${partida.golsTime1 == null}">
                            <span th:text="${partida.golsTime1}">0</span>
                            <span class="separator">×</span>
                            <span th:text="${partida.golsTime2}">0</span>
                        </div>
                        <div class="match-team">
                            <span class="flag" th:text="${partida.time2.bandeira}">🏳️</span>
                            <span class="name" th:text="${partida.time2.nome}">Time 2</span>
                        </div>
                    </div>
                </a>
            </div>
        </section>

        <div class="mt-2" style="text-align: center;">
            <a href="/selecoes" class="btn btn-outline">← Voltar às seleções</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="/js/app.js"></script>
</body>
</html>
