<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Detalhe da Partida')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <!-- Match Hero -->
        <section class="match-detail-hero">
            <span class="match-phase"
                  th:classappend="'phase-' + ${#strings.toLowerCase(partida.fase)}"
                  th:text="${partida.fase}"
                  style="font-size: 0.9rem; padding: 4px 16px;">Fase</span>

            <div class="match-detail-teams">
                <div class="match-detail-team">
                    <span class="flag" th:text="${partida.time1.bandeira}">🏳️</span>
                    <span class="name" th:text="${partida.time1.nome}">Time 1</span>
                </div>

                <div class="match-detail-score" th:if="${partida.golsTime1 != null}">
                    <span th:text="${partida.golsTime1} + ' × ' + ${partida.golsTime2}">0 × 0</span>
                </div>
                <div class="match-detail-score pending" th:unless="${partida.golsTime1 != null}">
                    <span>A DEFINIR</span>
                </div>

                <div class="match-detail-team">
                    <span class="flag" th:text="${partida.time2.bandeira}">🏳️</span>
                    <span class="name" th:text="${partida.time2.nome}">Time 2</span>
                </div>
            </div>

            <span class="status-badge"
                  th:classappend="'status-' + ${#strings.toLowerCase(partida.status)}"
                  th:text="${partida.status == 'FINALIZADA' ? '✅ Finalizada' : partida.status == 'AGENDADA' ? '🕐 Agendada' : '⚡ Em andamento'}"
                  style="font-size: 0.85rem; padding: 4px 14px;">
                Status
            </span>
        </section>

        <!-- Info Cards -->
        <div class="detail-grid">
            <div class="detail-info">
                <span style="font-size: 1.5rem;">📅</span>
                <div>
                    <div class="label">Data</div>
                    <div class="value" th:text="${#temporals.format(partida.data, 'dd/MM/yyyy')}">01/01/2026</div>
                </div>
            </div>
            <div class="detail-info">
                <span style="font-size: 1.5rem;">🕐</span>
                <div>
                    <div class="label">Horário</div>
                    <div class="value" th:text="${#temporals.format(partida.horario, 'HH:mm')}">16:00</div>
                </div>
            </div>
            <div class="detail-info" th:if="${partida.estadio != null}">
                <span style="font-size: 1.5rem;">🏟️</span>
                <div>
                    <div class="label">Estádio</div>
                    <div class="value" th:text="${partida.estadio.nome}">Estádio</div>
                </div>
            </div>
            <div class="detail-info" th:if="${partida.cidade != null}">
                <span style="font-size: 1.5rem;">🏙️</span>
                <div>
                    <div class="label">Cidade</div>
                    <div class="value" th:text="${partida.cidade.nome + ', ' + partida.cidade.pais}">Cidade</div>
                </div>
            </div>
            <div class="detail-info" th:if="${partida.estadio != null}">
                <span style="font-size: 1.5rem;">👥</span>
                <div>
                    <div class="label">Capacidade</div>
                    <div class="value" th:text="${#numbers.formatInteger(partida.estadio.capacidade, 1, 'POINT')} + ' lugares'">0 lugares</div>
                </div>
            </div>
        </div>

        <!-- Histórico dos Times -->
        <section class="mt-3">
            <h2 class="section-title mb-2"><span class="icon">📊</span> Outras partidas das seleções</h2>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <!-- Time 1 -->
                <div class="card">
                    <div class="card-header">
                        <h3>
                            <span th:text="${partida.time1.bandeira}">🏳️</span>
                            <span th:text="${partida.time1.nome}">Time 1</span>
                        </h3>
                    </div>
                    <div class="card-body">
                        <div th:each="p : ${partidasTime1}" style="padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 0.85rem;">
                                    <span th:text="${p.time1.bandeira}">🏳</span>
                                    <span th:text="${p.time1.nome}">T1</span>
                                    <strong th:text="${p.placar}">- x -</strong>
                                    <span th:text="${p.time2.nome}">T2</span>
                                    <span th:text="${p.time2.bandeira}">🏳</span>
                                </span>
                                <span class="status-badge"
                                      th:classappend="'status-' + ${#strings.toLowerCase(p.status)}"
                                      th:text="${p.fase}" style="font-size: 0.7rem;">Fase</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Time 2 -->
                <div class="card">
                    <div class="card-header">
                        <h3>
                            <span th:text="${partida.time2.bandeira}">🏳️</span>
                            <span th:text="${partida.time2.nome}">Time 2</span>
                        </h3>
                    </div>
                    <div class="card-body">
                        <div th:each="p : ${partidasTime2}" style="padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 0.85rem;">
                                    <span th:text="${p.time1.bandeira}">🏳</span>
                                    <span th:text="${p.time1.nome}">T1</span>
                                    <strong th:text="${p.placar}">- x -</strong>
                                    <span th:text="${p.time2.nome}">T2</span>
                                    <span th:text="${p.time2.bandeira}">🏳</span>
                                </span>
                                <span class="status-badge"
                                      th:classappend="'status-' + ${#strings.toLowerCase(p.status)}"
                                      th:text="${p.fase}" style="font-size: 0.7rem;">Fase</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="mt-2" style="text-align: center;">
            <a href="/partidas" class="btn btn-outline">← Voltar às partidas</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="/js/app.js"></script>
</body>
</html>
