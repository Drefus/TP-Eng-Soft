<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Seleções')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <div class="page-header">
            <h1>🏆 Seleções Participantes</h1>
            <p class="description">Conheça todas as seleções que disputam a Copa do Mundo de 2026.</p>
        </div>

        <!-- Grupos com Tabelas -->
        <div th:each="entry : ${grupos}" class="group-section">
            <div class="group-header">
                <span class="group-badge" th:text="${entry.key}">A</span>
                <span th:text="'Grupo ' + ${entry.key}">Grupo A</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Seleção</th>
                        <th class="text-center">Pts</th>
                        <th class="text-center">J</th>
                        <th class="text-center">V</th>
                        <th class="text-center">E</th>
                        <th class="text-center">D</th>
                        <th class="text-center">GP</th>
                        <th class="text-center">GC</th>
                        <th class="text-center">SG</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="selecao, iter : ${entry.value}">
                        <td>
                            <span class="fw-bold" th:text="${iter.index + 1}"
                                  th:style="${iter.index < 2 ? 'color: var(--success)' : 'color: var(--text-muted)'}">1</span>
                        </td>
                        <td>
                            <a th:href="@{/selecoes/{id}(id=${selecao.id})}" class="team-cell">
                                <span class="flag" th:text="${selecao.bandeira}">🏳️</span>
                                <span th:text="${selecao.nome}">Seleção</span>
                            </a>
                        </td>
                        <td class="text-center fw-bold" th:text="${selecao.pontos}">0</td>
                        <td class="text-center" th:text="${selecao.jogos}">0</td>
                        <td class="text-center text-success" th:text="${selecao.vitorias}">0</td>
                        <td class="text-center text-warning" th:text="${selecao.empates}">0</td>
                        <td class="text-center text-danger" th:text="${selecao.derrotas}">0</td>
                        <td class="text-center" th:text="${selecao.golsPro}">0</td>
                        <td class="text-center" th:text="${selecao.golsContra}">0</td>
                        <td class="text-center fw-semibold" th:text="${selecao.saldoGols}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Cards Grid -->
        <h2 class="section-title mt-3 mb-2"><span class="icon">🌍</span> Todas as Seleções</h2>
        <div class="card-grid" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));">
            <a th:each="selecao : ${selecoes}" th:href="@{/selecoes/{id}(id=${selecao.id})}" class="team-card">
                <span class="flag" th:text="${selecao.bandeira}">🏳️</span>
                <h3 th:text="${selecao.nome}">Seleção</h3>
                <span class="group-tag" th:text="'Grupo ' + ${selecao.grupo}">Grupo A</span>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="/js/app.js"></script>
</body>
</html>
