<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <span class="icon">🔐</span>
                <h2>Área Administrativa</h2>
                <p class="subtitle">Faça login para gerenciar o evento.</p>

                <div th:if="${errorMsg}" class="alert alert-error">
                    ❌ <span th:text="${errorMsg}">Login ou senha inválidos!</span>
                </div>

                <div th:if="${param.error}" class="alert alert-error">
                    ❌ Login ou senha inválidos!
                </div>

                <div th:if="${param.logout}" class="alert alert-success">
                    ✅ Você saiu com sucesso.
                </div>

                <form th:action="@{/login}" method="post" class="login-form">
                    <div class="form-group">
                        <label for="username">Login</label>
                        <input type="text" id="username" name="username" placeholder="Digite seu login" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary">🚀 Entrar</button>
                </form>

                <p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
                    Acesso restrito a administradores do evento.
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="/js/app.js"></script>
</body>
</html>
