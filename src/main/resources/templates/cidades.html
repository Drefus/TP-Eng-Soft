<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Cidades-Sede')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <div class="page-header">
            <h1>🏙️ Cidades-Sede</h1>
            <p class="description">Conheça as cidades que sediam o evento, seus estádios, aeroportos e rede hoteleira.</p>
        </div>

        <div class="card-grid">
            <a th:each="cidade : ${cidades}" th:href="@{/cidades/{id}(id=${cidade.id})}" class="city-card">
                <div class="city-card-image">
                    <span>🏙️</span>
                </div>
                <div class="city-card-body">
                    <h3 th:text="${cidade.nome}">Cidade</h3>
                    <p class="country" th:text="${cidade.pais}">País</p>
                    <div class="city-info-row" th:if="${cidade.estadio != null}">
                        <span>🏟️</span>
                        <span th:text="${cidade.estadio.nome}">Estádio</span>
                    </div>
                    <div class="city-info-row" th:if="${cidade.estadio != null}">
                        <span>👥</span>
                        <span th:text="'Capacidade: ' + ${#numbers.formatInteger(cidade.estadio.capacidade, 1, 'POINT')}">Capacidade</span>
                    </div>
                    <div class="city-info-row">
                        <span>🏨</span>
                        <span th:text="${#lists.size(cidade.hoteis)} + ' hotéis cadastrados'">0 hotéis</span>
                    </div>
                    <div class="city-info-row">
                        <span>✈️</span>
                        <span th:text="${#lists.size(cidade.aeroportos)} + ' aeroportos'">0 aeroportos</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="/js/app.js"></script>
</body>
</html>
