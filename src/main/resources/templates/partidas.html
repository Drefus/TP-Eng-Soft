<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Partidas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <div class="page-header">
            <h1>📅 Tabela de Jogos</h1>
            <p class="description">Confira todas as partidas do evento. Use os filtros para encontrar jogos específicos.</p>
        </div>

        <!-- Filtros -->
        <form id="filterForm" class="filter-bar" method="get" action="/partidas">
            <div class="filter-group">
                <label for="data">📆 Data</label>
                <input type="date" id="data" name="data" th:value="${dataFiltro}">
            </div>
            <div class="filter-group">
                <label for="selecaoId">🏴 Seleção</label>
                <select id="selecaoId" name="selecaoId">
                    <option value="">Todas as seleções</option>
                    <option th:each="s : ${selecoes}" th:value="${s.id}" th:text="${(s.bandeira != null ? s.bandeira + ' ' : '') + s.nome}"
                            th:selected="${selecaoFiltro != null and selecaoFiltro == s.id}">Seleção</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="cidadeId">🏙️ Cidade</label>
                <select id="cidadeId" name="cidadeId">
                    <option value="">Todas as cidades</option>
                    <option th:each="c : ${cidades}" th:value="${c.id}" th:text="${c.nome}"
                            th:selected="${cidadeFiltro != null and cidadeFiltro == c.id}">Cidade</option>
                </select>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">🔍 Filtrar</button>
            </div>
            <div th:if="${dataFiltro != null or selecaoFiltro != null or cidadeFiltro != null}">
                <a href="/partidas" class="btn btn-outline">✕ Limpar</a>
            </div>
        </form>

        <!-- Lista de Partidas -->
        <div class="card-grid" th:if="${not #lists.isEmpty(partidas)}">
            <a th:each="partida : ${partidas}" th:href="@{/partidas/{id}(id=${partida.id})}" class="match-card">
                <div class="match-meta">
                    <span th:text="${#temporals.format(partida.data, 'dd/MM/yyyy')} + ' • ' + ${#temporals.format(partida.horario, 'HH:mm')}"></span>
                    <span class="match-phase"
                          th:classappend="'phase-' + ${#strings.toLowerCase(partida.fase)}"
                          th:text="${partida.fase}">Grupo</span>
                </div>
                <div class="match-teams">
                    <div class="match-team">
                        <span class="flag" th:text="${partida.time1.bandeira}">🏳️</span>
                        <span class="name" th:text="${partida.time1.nome}">Time 1</span>
                    </div>
                    <div class="match-score pending" th:if="${partida.golsTime1 == null}">
                        <span>— × —</span>
                    </div>
                    <div class="match-score" th:unless="${partida.golsTime1 == null}">
                        <span th:text="${partida.golsTime1}">0</span>
                        <span class="separator">×</span>
                        <span th:text="${partida.golsTime2}">0</span>
                    </div>
                    <div class="match-team">
                        <span class="flag" th:text="${partida.time2.bandeira}">🏳️</span>
                        <span class="name" th:text="${partida.time2.nome}">Time 2</span>
                    </div>
                </div>
                <div class="match-venue" th:if="${partida.estadio != null}">
                    <span>🏟️</span>
                    <span th:text="${partida.estadio.nome}">Estádio</span>
                    <span th:if="${partida.cidade != null}">•</span>
                    <span th:if="${partida.cidade != null}" th:text="${partida.cidade.nome}">Cidade</span>
                </div>
                <div style="margin-top: 0.5rem;">
                    <span class="status-badge"
                          th:classappend="'status-' + ${#strings.toLowerCase(partida.status)}"
                          th:text="${partida.status == 'FINALIZADA' ? '✅ Finalizada' : partida.status == 'AGENDADA' ? '🕐 Agendada' : '⚡ Em andamento'}">
                        Status
                    </span>
                </div>
            </a>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(partidas)}">
            <div class="icon">🔍</div>
            <p>Nenhuma partida encontrada com os filtros selecionados.</p>
            <a href="/partidas" class="btn btn-outline mt-1">Limpar filtros</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="/js/app.js"></script>
</body>
</html>
